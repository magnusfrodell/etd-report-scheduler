# Alembic configuration - the application overrides script_location and
# sqlalchemy.url at runtime (see app/db.py), so this file only needs to exist
# for manual use: `alembic revision --autogenerate -m "..."`.
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./data/etd.db
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
