# docker compose up -d
#
# Copy .env.example to .env first and fill in the three required secrets.
# The SQLite database, report archive and settings live in the etd-data volume.
services:
  etd-report-scheduler:
    build: .
    # image: ghcr.io/magnusfrodell/etd-report-scheduler:0.6.0   # published for every release tag; use instead of build:
    container_name: etd-report-scheduler
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - etd-data:/data
    # Optional PostgreSQL for larger partner deployments: uncomment the service
    # below and set DATABASE_URL=postgresql+psycopg://etd:etd@db:5432/etd in .env
    # (add `psycopg[binary]` to requirements.txt when building).
    # depends_on:
    #   - db

  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: etd
  #     POSTGRES_PASSWORD: etd
  #     POSTGRES_DB: etd
  #   volumes:
  #     - etd-pg:/var/lib/postgresql/data

volumes:
  etd-data:
  # etd-pg:
