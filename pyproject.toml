[project]
name = "etd-report-scheduler"
version = "0.9.0"
description = "Scheduled, multi-tenant reporting for Cisco Secure Email Threat Defense"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the app package lives at the repository root and is not installed
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends()/Form() in defaults is idiomatic; line length handled by formatter
