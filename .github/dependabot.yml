# Weekly pull requests for dependency, GitHub Actions and base image updates.
# pip: Dependabot regenerates the hashed requirements.txt from requirements.in (pip-compile).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
