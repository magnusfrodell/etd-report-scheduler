name: Docker image

# Pushing a tag such as v0.6.0 runs the tests, builds the image, checks that a container starts,
# migrates and answers, and only then publishes a multi-arch image to
# ghcr.io/<owner>/etd-report-scheduler:0.6.0 (plus 0.6 and latest).
# Make the package public once under Packages > etd-report-scheduler > Settings
# so customers can `docker pull` without authenticating.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: etd-report-scheduler:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test - the container starts, migrates and answers
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e ENCRYPTION_KEY="$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e ADMIN_PASSWORD=smoke-test-password \
            etd-report-scheduler:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
