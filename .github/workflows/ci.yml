name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the Docker workflow runs this before it builds a release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for PDF rendering (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core  # as in the Dockerfile
      - name: Locked runtime dependencies (exactly what the image installs)
        run: pip install --require-hashes -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Migrations are in sync with the models
        run: |
          DATABASE_URL=sqlite:///./ci.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci.db alembic check
      - name: Known vulnerabilities in the locked dependencies
        run: pip-audit -r requirements.txt --require-hashes --disable-pip
